# Site configuration for the CCC LSF cluster, "normal" queue.
# LSF_UNIT_FOR_LIMITS=GB on this site, so -M and rusage[mem=] are in GB.
[lsf]
queue = "normal"

# Controller dispatch budgets include pending and suspended jobs.
max_jobs = 150
max_cpus = 150
max_memory_gb = 2000
poll_seconds = 20
visibility_grace_seconds = 900
job_wall_seconds = 172800
shard_max_observations = 6
# Controller threads for bsub calls and for result publication (fsync-bound on
# GPFS). Measured 2026-11-11: one thread spent ~2.2 s per six-observation shard
# (1.0-1.5 s publishing results, 0.35 s intents, 0.2-0.4 s bsub) and held only
# ~55 short shards in flight regardless of max_jobs.
submit_workers = 8
collect_workers = 8

memory_unit = "GB"
memory_per_slot = false
# LSB_RESOURCE_ENFORCE="cpu memory gpu" on this site: the cgroup limit counts
# the shard supervisor and page cache alongside the worker, so the job limit
# must sit above the frozen worker budget for the in-job watchdog to act first.
memory_headroom_gb = 1

controller_cpus = 1
controller_memory_gb = 8
build_cpus = 8
build_memory_gb = 32

bsub = "bsub"
bjobs = "bjobs"
bhist = "bhist"
bkill = "bkill"
machine_readable = true
