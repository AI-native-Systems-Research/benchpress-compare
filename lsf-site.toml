# Site configuration for the CCC LSF cluster, "normal" queue.
# LSF_UNIT_FOR_LIMITS=GB on this site, so -M and rusage[mem=] are in GB.
[lsf]
queue = "normal"

# Controller dispatch budgets include pending and suspended jobs.
max_jobs = 300
max_cpus = 300
# 300 one-CPU workers at 10 GiB each, with room for scheduler headroom.
max_memory_gb = 4000
# Most short shards finish in about 30 s. Refill within 2 s of completion,
# rather than allowing a 20 s idle gap between scheduler polls.
poll_seconds = 2
visibility_grace_seconds = 900
job_wall_seconds = 172800
shard_max_observations = 6
# Controller threads for preparation, bsub and recording, and for publication.
# Private file staging overlaps; replacements stay fenced and journal records
# sync in batches. Publication proceeds while dispatch fills free slots.
submit_workers = 16
collect_workers = 16

memory_unit = "GB"
memory_per_slot = false
# LSB_RESOURCE_ENFORCE="cpu memory gpu" on this site: the cgroup limit counts
# the shard supervisor and page cache alongside the worker, so the job limit
# must sit above the frozen worker budget for the in-job watchdog to act first.
memory_headroom_gb = 1

controller_cpus = 1
controller_memory_gb = 8
build_cpus = 8
build_memory_gb = 32

bsub = "bsub"
bjobs = "bjobs"
bhist = "bhist"
bkill = "bkill"
machine_readable = true
