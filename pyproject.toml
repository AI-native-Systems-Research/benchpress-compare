[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "benchpress-compare"
version = "0.1.0"
description = "Reproducible, resumable comparisons of Qiskit source builds"
requires-python = ">=3.12,<3.13"
dependencies = ["psutil==7.1.3", "jsonschema==4.25.1"]

[project.scripts]
benchpress-compare = "benchpress_compare.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]
integration = ["qiskit==2.5.2", "qiskit-ibm-runtime==0.43.1", "sympy==1.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchpress_compare"]

[tool.hatch.build.targets.wheel.force-include]
"data/candidates.json" = "benchpress_compare/data/candidates.json"
"data/LICENSE-BENCHPRESS.txt" = "benchpress_compare/data/LICENSE-BENCHPRESS.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the pinned Qiskit integration environment", "lsf: requires an explicitly configured LSF site"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
