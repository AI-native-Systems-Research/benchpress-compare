name: tests

on:
  push:
  pull_request:

jobs:
  coordinator:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pytest
      - run: uv run --locked benchpress-compare audit

  qiskit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - run: uv sync --locked --group integration
      - run: uv run --locked --group integration pytest
