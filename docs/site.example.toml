# Copy to an explicit site configuration and replace the queue.
# No queue, reservation, project, or filesystem location is implied by this file.
[lsf]
queue = "REPLACE_WITH_SITE_QUEUE"
# project = "your-project"
# reservation = "your-reservation"
# host_select = "type==X86_64"

# Controller dispatch budgets include pending and suspended jobs.
max_jobs = 16
max_cpus = 16
max_memory_gb = 128
poll_seconds = 10
visibility_grace_seconds = 300
job_wall_seconds = 86400
# Fixture and comparison jobs hold at most this many sequential observations
# (also bounded by job_wall_seconds); six is one case, three seeds on both arms.
# Every observation of a big circuit always gets a job of its own.
shard_max_observations = 6
# Controller threads for launch preparation, submission and recording, and for
# result publication. Private file staging overlaps; replacements stay fenced
# and journal records sync in batches. Publication also overlaps dispatch.
submit_workers = 8
collect_workers = 8

# Confirm both -M and rusage[mem=...] behavior against the site's LSF policy:
# check LSF_UNIT_FOR_LIMITS in lsf.conf. Supported configured units are KB, MB
# and GB. A wrong unit requests thousands of times too much or too little memory.
memory_unit = "MB"
# Override separately on sites where hard limits and reservations differ.
# memory_limit_unit = "KB"
# memory_reservation_unit = "MB"
memory_per_slot = false
# Added to each worker job's -M and rusage[mem=] on top of the frozen worker
# memory budget. With cgroup enforcement (LSB_RESOURCE_ENFORCE=memory) the
# scheduler counts the shard supervisor and page cache too, so without headroom
# it kills a worker before the in-job watchdog can report RESOURCE_LIMIT.
memory_headroom_gb = 1

controller_cpus = 1
controller_memory_gb = 4
# Set an execution-platform environment when the launch host differs from workers.
# It must already contain the pinned benchpress-compare coordinator package.
# controller_python = "/shared/coordinator/.venv/bin/python"
build_cpus = 4
build_memory_gb = 16

bsub = "bsub"
bjobs = "bjobs"
bhist = "bhist"
bkill = "bkill"
# Set false only when the site's requested jobid/stat/job_name text output is
# verified. Query command failure is not treated as an empty job listing.
machine_readable = true
